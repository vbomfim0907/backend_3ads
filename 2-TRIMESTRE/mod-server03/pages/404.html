<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 404 - Página Não Encontrada</title>
</head>
<body style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box;">

    <!-- Card Central de Erro -->
    <main style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); padding: 48px; max-width: 480px; width: 100%; text-align: center;">
        
        <!-- Espaço Reservado / Ícone de Alerta Dinâmico (SVG) -->
        <div style="width: 80px; height: 80px; background-color: #fef2f2; color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto;">
            <svg xmlns="http://w3.org" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" x2="12" y1="8" y2="12"/>
                <line x1="12" x2="12.01" y1="16" y2="16"/>
            </svg>
        </div>

        <!-- Textos Informativos -->
        <h3 style="margin: 0 0 8px 0; font-size: 32px; font-weight: 800; letter-spacing: -1px; color: #0f172a;">Erro 404</h3>
        <h4 style="margin: 0 0 12px 0; font-size: 18px; font-weight: 600; color: #334155;">Página Não Encontrada</h4>
        <p style="margin: 0 0 32px 0; color: #64748b; font-size: 15px; line-height: 1.6;">Ops! Ocorreu um erro inesperado nesta porta ou a página que você procura foi movida ou não existe mais.</p>
        
        <!-- Link de Navegação / Botão de Retorno -->
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="/compras" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; background-color: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);">
                <!-- Ícone de Sacola (SVG) -->
                <svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/></svg>
                Navegar para página de compras
            </a>
            
            <!-- Link secundário caso o usuário prefira voltar para a Home -->
            <a href="/" style="text-decoration: none; color: #64748b; font-weight: 500; font-size: 14px; margin-top: 8px; display: inline-block;">
                Voltar para a Página Inicial
            </a>
        </div>

    </main>

</body>
</html>
